name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Юнит-тесты и Settings() требуют полной конфигурации БД (pydantic-валидация),
# реального подключения при этом не происходит.
env:
  MCP_DATABASE_HOST: localhost
  MCP_DATABASE_PORT: "5432"
  MCP_DATABASE_USER: testuser
  MCP_DATABASE_PASSWORD: testpassword
  MCP_DATABASE_NAME: testdb
  # Camel-case field access shims are removed in a future FastMCP release; fail early.
  FASTMCP_MCP_CAMELCASE_COMPAT: "false"

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src/

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Run unit tests
        run: uv run pytest tests/unit -q

  integration-tests:
    name: Integration tests (postgres 15/16 + hypopg)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Build postgres-hypopg images
        run: uv run python tests/prepare_docker_images.py
      # -v: строка на тест (прогресс-точки без \n не флашатся в лог GHA);
      # --timeout ... --timeout-method=thread: зависший тест прерывается даже внутри C-вызова,
      # где signal-режим не срабатывает; прогон при этом завершается целиком со стеками всех потоков.
      - name: Run integration tests
        run: uv run pytest tests/integration -v --timeout=180 --timeout-method=thread --durations=20

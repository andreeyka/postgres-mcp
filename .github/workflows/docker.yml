# Образ сервера в GitHub Container Registry: ghcr.io/<owner>/postgres-mcp.
# Тег v* собирает его сам; уже выпущенный тег пересобирается вручную (Run workflow, поле tag).
name: Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tag must look like vX.Y.Z, got ${RELEASE_TAG}" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          project_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          if [[ "${project_version}" != "${version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match pyproject version ${project_version}" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          minor="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          {
            echo "version=${version}"
            echo "revision=$(git rev-parse HEAD)"
            echo "list<<EOF"
            echo "${image}:${version}"
            echo "${image}:${minor}"
            echo "${image}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
